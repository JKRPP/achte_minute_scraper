version: "3.8"
services:
  web:
    image: nginx:alpine
    container_name: motion-website
    ports:
      - "8085:80"
    volumes:
      - site:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks:
      - default
      - proxy

  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    container_name: motion-scraper
    environment:
      CACHE_DIR: /app/cache
      OUTPUT_DIR: /app/site
      IMPRESSUM_NAME: Max Mustermann
      IMPRESSUM_ADDRESS: |
        Musterstr. 123
        67890 Musterstadt
      IMPRESSUM_EMAIL: muster@mail.de
    volumes:
      - cache:/app/cache
      - site:/app/site
    restart: unless-stopped
    networks:
      - default

volumes:
  site:
  cache:

networks:
  proxy:
    name: ${PROXY_NETWORK}
    external: true
